# A cada push na main: testa, gera o site e publica SOMENTE o dist/ na branch `deploy`.
# A Hostinger (hPanel → Avançado → Git) puxa a branch `deploy` para o public_html,
# com implantação automática via webhook.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testes do motor de resultados
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Configure em Settings → Secrets and variables → Actions → Variables
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}

      - name: Publicar dist/ na branch deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
